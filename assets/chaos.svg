<text x="20" y="197" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">aquila worker -id worker-B -job 2e9d71d2a3c2a73c</tspan></text>
<text x="20" y="216" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" xml:space="preserve"><tspan fill="#e6edf3">  latency   </tspan><tspan fill="#3fb950">succeeded</tspan><tspan fill="#e6edf3">  fence=2  attempt=9e3315ee...   </tspan><tspan fill="#7d8590">worker-B</tspan></text>
<text x="20" y="235" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" xml:space="preserve"><tspan fill="#7d8590">    notes   </tspan><tspan fill="#f85149">latency_shift GET /health median 0.2ms -&gt; 1501.8ms; blocks validated</tspan></text>
