<text x="440.0" y="22.0" text-anchor="middle" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">kill -9 a worker mid-task</text>
<text x="20" y="64" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">aquila jobs 2e9d71d2a3c2a73c</tspan></text>
<text x="20" y="83" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" xml:space="preserve"><tspan fill="#e6edf3">  latency   </tspan><tspan fill="#58a6ff">leased</tspan><tspan fill="#e6edf3">     fence=1  attempt=c620807f...   </tspan><tspan fill="#7d8590">worker-A</tspan></text>
<text x="20" y="102" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" xml:space="preserve"><tspan fill="#e6edf3"></tspan></text>
<text x="20" y="121" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">kill -9 $WORKER_A</tspan></text>
<text x="20" y="140" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" xml:space="preserve"><tspan fill="#7d8590">  ... 17s later (lease TTL 15s)</tspan></text>
