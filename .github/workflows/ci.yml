name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: build-test-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aquila
          POSTGRES_PASSWORD: aquila
          POSTGRES_DB: aquila
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquila -d aquila"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AQUILA_TEST_POSTGRES_URL: postgres://aquila:aquila@127.0.0.1:5432/aquila?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Lint
        run: make lint

      - name: Migrate
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          migrate -path migrations -database "$AQUILA_TEST_POSTGRES_URL" up

      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Test
        run: make test

      - name: Build
        run: make build

  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        run: docker compose -f deploy/compose/docker-compose.yaml -f deploy/compose/docker-compose.shop.yaml config -q

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Format and validate
        run: make terraform-eval
